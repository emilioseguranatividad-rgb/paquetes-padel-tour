:root{
  color-scheme:dark;
  --night:#0a1a35; --panel:#102a52; --panel2:#17386b; --edge:#2b5a9e;
  --court:#1659a8; --court2:#1b6cc4; --line:#eaf2ff;
  --ball:#d9f23a; --gold:#f7bd2f; --potato:#b98a4e;
  --ink:#eef4ff; --muted:#a9bfdd; --good:#46d68a; --bad:#ff6b6b; --dark:#0a1a35;
  --f-logo:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  --f-title:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --f-body:"VT323",ui-monospace,Menlo,Consolas,monospace;
}
html{background:var(--night)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:20px;line-height:1.2;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.fld{width:100%;background:var(--panel2);color:var(--ink);border:0;padding:10px;font:inherit}
.formg{display:grid;gap:6px}
.mov{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:2px solid var(--panel2);font-size:18px;min-width:0}
.install{background:var(--panel);padding:10px 12px;display:grid;gap:6px;font-size:18px;line-height:1.15;border-left:4px solid var(--ball)}
.busy{position:fixed;inset:0;z-index:75;background:rgba(10,26,53,.8);display:grid;place-items:center;font-family:var(--f-title);font-size:22px}
.lnk{all:unset;cursor:pointer;color:var(--line);font-size:18px;text-decoration:underline;justify-self:center}
.lnk:focus-visible{outline:3px solid var(--ball)}
#layer2{position:relative;z-index:70}
#layer2 .ov{z-index:70}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
canvas,.px{image-rendering:pixelated;image-rendering:crisp-edges}
canvas,.px{image-rendering:pixelated}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 112px;display:grid;gap:20px}
.top{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:1;min-width:0;font-family:var(--f-logo);line-height:1.5;font-size:11px;color:var(--muted)}
.logo b{display:block;color:var(--ball);font-size:clamp(17px,6vw,24px);font-weight:400;line-height:1.3}
.sound{flex:none;background:var(--panel2);border:0;padding:9px 12px;font-family:var(--f-title);font-weight:600;font-size:16px;color:var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3)}
.sound[aria-pressed=true]{background:var(--ball);color:var(--dark)}
.demo{font-size:18px;color:var(--muted);line-height:1.15}
h2{font-family:var(--f-title);font-weight:700;font-size:25px;margin:0;text-wrap:balance}
h3{font-family:var(--f-title);font-weight:600;font-size:20px;margin:0;color:var(--ball)}
p{margin:0}
.sec{display:grid;gap:10px;min-width:0}
.sub{color:var(--muted);font-size:19px}
.court{position:relative;background:repeating-linear-gradient(90deg,var(--court) 0 28px,var(--court2) 28px 56px);padding:14px 12px 12px;display:grid;gap:10px;box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line);margin:4px}
.court::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(234,242,255,.35)}
.court>*{position:relative}
.eyebrow{font-family:var(--f-title);font-weight:600;font-size:15px;letter-spacing:1px;color:var(--ball);line-height:1.2}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:4px}
.team{display:flex;justify-content:center;min-width:0}
.team canvas{width:min(21vw,96px);height:auto;margin-inline:-5px}
.vs{font-family:var(--f-logo);font-size:12px;padding-bottom:30px;color:var(--line)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;font-family:var(--f-title);font-size:18px;line-height:1.1}
.names .w{color:var(--ball)} .names .l{color:var(--line);opacity:.85}
.btn{display:block;width:100%;border:0;background:var(--ball);color:var(--dark);font-family:var(--f-title);font-weight:700;font-size:19px;letter-spacing:1px;line-height:1.2;padding:13px 10px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(2px)}
.btn.alt{background:var(--panel2);color:var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero-card{background:var(--panel);padding:10px;display:grid;justify-items:center;gap:2px;text-align:center;min-width:0;border-top:4px solid var(--c,var(--edge))}
.hero-card canvas{width:96px;height:auto}
.hero-card .t{font-family:var(--f-logo);font-size:9px;line-height:1.5;color:var(--muted);min-height:28px}
.hero-card .n{font-family:var(--f-title);font-size:21px;font-weight:700}
.hero-card .v{font-size:18px;color:var(--muted)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.tabs button{border:0;background:var(--panel);padding:10px 4px;font-family:var(--f-title);font-size:19px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--ball);color:var(--dark)}
select{width:100%;background:var(--panel2);border:0;padding:10px;font-size:20px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-weight:400;color:var(--muted);text-align:right;font-size:17px;padding:4px 4px}
th:nth-child(2){text-align:left}
td{padding:4px;text-align:right;border-top:2px solid var(--panel2)}
td.j{text-align:left;font-family:var(--f-title);font-size:19px}
td.j button{all:unset;display:flex;align-items:center;gap:7px;cursor:pointer}
td.j button:focus-visible{outline:3px solid var(--ball)}
td.pos{color:var(--muted);text-align:center;width:22px}
td.pct{color:var(--ball)}
.out td{opacity:.72}
.head{width:30px;height:30px;background:var(--panel2);flex:none;display:block}
.form{display:inline-flex;gap:2px;vertical-align:middle}
.form i{width:9px;height:12px;background:var(--panel2);display:block;position:relative}
.form i.v{background:var(--good)} .form i.d{background:var(--bad);height:7px;margin-top:5px}
.scroll{overflow-x:auto;min-width:0}
.note{min-height:44px;font-size:18px;color:var(--muted);background:var(--panel);padding:8px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:17px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:4px;display:block}
.matrix{display:grid;gap:2px;min-width:320px}
.matrix>*{aspect-ratio:1;display:flex;align-items:center;justify-content:center;min-width:0;border:0;padding:0;font-size:17px;background:var(--panel)}
.matrix button{color:var(--ink)}
.matrix img{width:100%;height:100%}
.matrix .self{background:var(--panel2)}
.plist{display:grid;gap:6px}
.pair{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--panel);padding:6px 10px 6px 6px;min-width:0}
.pair .hs{display:flex;gap:2px}
.pair .nm{font-family:var(--f-title);font-size:18px;min-width:0}
.pair .sc{font-size:19px;color:var(--ball);white-space:nowrap}
.pair.low .sc{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cromo{all:unset;cursor:pointer;background:var(--panel);display:grid;justify-items:center;text-align:center;padding:10px 6px;gap:2px;border-bottom:4px solid var(--c,var(--edge));min-width:0}
.cromo:focus-visible{outline:3px solid var(--ball)}
.cromo canvas{width:112px;height:auto}
.cromo.wide{grid-column:1/-1}
.cromo.wide canvas{width:192px}
.cromo .n{font-family:var(--f-title);font-size:22px;font-weight:700}
.cromo .m{font-size:18px;color:var(--muted);line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats div{background:var(--panel);padding:8px 4px;text-align:center}
.stats b{display:block;font-family:var(--f-logo);font-weight:400;font-size:14px;color:var(--ball);line-height:1.5}
.stats span{font-size:16px;color:var(--muted)}
.ach{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:6px 0;border-top:2px solid var(--panel2)}
.ach .ic{width:32px;height:32px}
.ach b{font-family:var(--f-title);font-size:19px;display:block;line-height:1.1}
.ach span{color:var(--muted);font-size:18px;line-height:1.1;display:block}
.catalog{width:100%}
.catalog td,.catalog th{text-align:left;vertical-align:top;padding:6px 8px 6px 0}
.catalog th{color:var(--ball)}
.catalog td:first-child{color:var(--muted);white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:#071427;display:grid;grid-template-columns:repeat(5,1fr);border-top:3px solid var(--edge);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:7px 2px 6px;font-family:var(--f-title);font-size:14px;color:var(--muted)}
nav button:focus-visible{outline:3px solid var(--ball);outline-offset:-3px}
nav img{width:24px;height:24px}
nav button[aria-current=page]{color:var(--ball);background:var(--panel)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;border:0;background:var(--ball);color:var(--dark);font-family:var(--f-title);font-weight:700;font-size:17px;padding:11px 13px;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.45)}

.ov .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.close{border:0;background:var(--panel2);font-family:var(--f-title);font-weight:600;font-size:16px;padding:9px 12px}
.big canvas{width:170px;height:auto;display:block;margin:0 auto}
.posebar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.posebar button{border:0;background:var(--panel);padding:8px;font-family:var(--f-title);font-size:18px}
.posebar button[aria-pressed=true]{background:var(--ball);color:var(--dark)}
.veh{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 10px;font-size:19px}
.veh canvas{width:96px;height:auto;flex:none}
.tag{display:inline-block;background:var(--panel2);padding:1px 7px;font-size:17px}
.pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick button{border:0;background:var(--panel);padding:6px 2px;display:grid;justify-items:center;font-family:var(--f-title);font-size:16px;min-width:0}
.pick button img{width:42px;height:42px}
.pick button[data-t=a]{background:var(--ball);color:var(--dark)}
.pick button[data-t=b]{background:var(--gold);color:var(--dark)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.slots div{background:var(--panel);padding:8px;font-family:var(--f-title);font-size:18px;min-height:56px}
.slots div b{display:block;font-family:var(--f-logo);font-weight:400;font-size:9px;margin-bottom:6px}
.choice{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.choice button{border:0;background:var(--panel);padding:12px 6px;font-family:var(--f-title);font-size:18px;line-height:1.1}
.choice button[aria-pressed=true]{background:var(--ball);color:var(--dark)}
.deb{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-top:2px solid var(--panel2)}
.deb .nm{font-family:var(--f-title);font-size:19px}
.deb .eu{font-family:var(--f-logo);font-size:12px;color:var(--gold)}
.deb .eu.ok{color:var(--good)}
.mini{border:0;background:var(--panel2);padding:6px 9px;font-size:17px}
.hist{grid-column:1/-1;font-size:18px;color:var(--muted);padding-bottom:6px}
.cine{position:fixed;inset:0;z-index:50;overflow-y:auto;background:repeating-linear-gradient(90deg,#114a8f 0 32px,#1558a6 32px 64px)}
.cine .stage{position:relative;max-width:520px;min-height:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;align-content:center;gap:10px;text-align:center}
.cine #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.cine .row{display:flex;justify-content:center;position:relative}
.cine .row canvas[data-sp]{width:min(34vw,136px,18vh);height:auto;margin-inline:-8px}

.cine .lost{font-family:var(--f-logo);font-size:clamp(12px,3.8vw,15px);line-height:1.6;color:var(--line);position:relative}

.cine .btn{position:relative}
.cine .cloud{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:min(56vw,224px);height:auto;z-index:1}
.flash{animation:fl .24s steps(2) infinite}
@keyframes fl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ball);color:var(--dark);padding:7px 12px;z-index:80;font-size:19px;max-width:90vw;text-align:center}
</style>
</head>

function allTable(){const t={};for(const s of Object.values(HIST))for(const[id,[v,pj]]of Object.entries(s.t)){t[id]=t[id]||{id,v:0,pj:0,f:[]};t[id].v+=v;t[id].pj+=pj}

 return Object.values(t).map(r=>({...r,p:r.v/r.pj})).sort((a,b)=>b.p-a.p||b.v-a.v)}
function vPart(){const all=state.per==='all:',ms=periodMs(),n=all?ALL().length+70:ms.length,st=all?allTable():table(ms),min=Math.ceil(n*.4);
 const form=f=>`<span class="form" aria-label="últimas">${(f||[]).slice(-5).map(x=>`<i class="${x}"></i>`).join('')}</span>`;
 const row=(r,i,out)=>`<tr class="${out?'out':''}"><td class="pos">${out?'':i+1}</td><td class="j"><button type="button" data-p="${r.id}">${himg(r.id)}${nm(r.id)}</button></td><td>${r.v}</td><td>${r.pj}</td><td class="pct">${pct(r.v,r.pj)}%</td><td>${form(r.f)}</td></tr>`;
 const a=st.filter(r=>r.pj>=min),b=st.filter(r=>r.pj<min);
 return `<section class="sec"><p class="sub">${n} partidas. Cada partido ganado vale 1 punto. Para optar a premio hay que jugar al menos ${min}.</p><div class="scroll"><table><thead><tr><th></th><th>Jugador</th><th>V</th><th>PJ</th><th>%</th><th>Forma</th></tr></thead><tbody>${a.map((r,i)=>row(r,i)).join('')}${b.length?`<tr><td colspan="6" class="sub" style="text-align:left">Sin el mínimo de partidas</td></tr>`:''}${b.map(r=>row(r,0,1)).join('')}</tbody></table></div>${all?'<p class="demo">Incluye 2023-24 y 2024-25: victorias de vuestro Excel y partidas recontadas una a una. Boss cuenta como Nacho. David, Josep y otros invitados no salen.</p>':''}</section>
 ${all?'':`<section class="sec"><h2>Carrera por el título</h2>${race(ms)}</section><section class="sec"><h2>Parejas</h2>${pairBlock(ms)}</section><section class="sec"><h2>Quién funciona con quién</h2>${matrix(ms)}</section>`}`}
function vPost(){const ms=periodMs(),st=postTable(ms),n=ms.filter(m=>m.p).length;
 if(!st.length)return `<section class="sec"><p class="sub">No hubo postpartidos en este periodo. Se empezaron a apuntar el 21 de octubre de 2026.</p></section>`;
 return `<section class="sec"><p class="sub">${n} postpartidos. Cada uno ganado vale 0,5 puntos y va en su propia tabla: no afecta a la de partidos.</p><div class="scroll"><table><thead><tr><th></th><th>Jugador</th><th>Pts</th><th>G</th><th>J</th></tr></thead><tbody>${st.map((r,i)=>`<tr><td class="pos">${i+1}</td><td class="j"><button type="button" data-p="${r.id}">${himg(r.id)}${nm(r.id)}</button></td><td class="pct">${String(r.pts).replace('.',',')}</td><td>${r.v}</td><td>${r.pj}</td></tr>`).join('')}</tbody></table></div></section>`}
function race(ms){const st=table(ms).filter(r=>r.pj>=Math.min(3,Math.ceil(ms.length/3))).sort((a,b)=>b.v-a.v).slice(0,6),ids=st.map(r=>r.id),n=ms.length;
 const VW=340,VH=190,ml=20,mr=92,mt=8,mb=20,ser={};ids.forEach(i=>ser[i]=[0]);ms.forEach(m=>ids.forEach(i=>{const a=ser[i];a.push(a[a.length-1]+(wn(m).includes(i)?1:0))}));
 const max=Math.max(...ids.map(i=>ser[i][n]),1),x=i=>ml+i*(VW-ml-mr)/n,y=v=>VH-mb-v*(VH-mb-mt)/max;
 const step=Math.ceil(max/4);let grid='';for(let v=0;v<=max;v+=step)grid+=`<line x1="${ml}" x2="${VW-mr}" y1="${y(v)}" y2="${y(v)}" stroke="#2b5a9e" stroke-width="1" opacity=".5"/><text x="${ml-5}" y="${y(v)+4}" text-anchor="end" fill="#a9bfdd" font-size="13">${v}</text>`;
 const lines=ids.map(i=>{let d=`M${x(0)} ${y(0)}`;ser[i].forEach((v,k)=>{if(k){d+=`H${x(k)}V${y(v)}`}});return `<path d="${d}" fill="none" stroke="${CAST[i].col}" stroke-width="2.5" shape-rendering="crispEdges"/>`}).join('');
 const lab=[...ids].sort((a,b)=>ser[b][n]-ser[a][n]).map(i=>({i,y:y(ser[i][n])}));for(let k=1;k<lab.length;k++)if(lab[k].y<lab[k-1].y+21)lab[k].y=lab[k-1].y+21;const over=lab.length?Math.max(0,lab[lab.length-1].y-(VH-14)):0;lab.forEach(l=>l.y-=over);
 const labels=lab.map(l=>`<image href="${head(l.i)}" x="${VW-mr+4}" y="${l.y-10}" width="20" height="20" style="image-rendering:pixelated"/><text x="${VW-mr+27}" y="${l.y+5}" fill="#eef4ff" font-size="15">${ser[l.i][n]} ${nm(l.i)}</text>`).join('');
 const hits=ms.map((m,k)=>`<rect data-m="${ALL().indexOf(m)}" x="${x(k)}" y="${mt}" width="${(VW-ml-mr)/n}" height="${VH-mb-mt}" fill="transparent"/>`).join('');
 return `<div class="scroll"><svg viewBox="0 0 ${VW} ${VH}" style="width:100%;min-width:320px;height:auto;display:block" role="img" aria-label="Victorias acumuladas por jugador">${grid}${lines}${labels}<text x="${ml}" y="${VH-5}" fill="#a9bfdd" font-size="13">${fd(ms[0].d)}</text><text x="${VW-mr}" y="${VH-5}" text-anchor="end" fill="#a9bfdd" font-size="13">${fd(ms[n-1].d)}</text>${hits}</svg></div><div class="legend">${ids.map(i=>`<span><i style="background:${CAST[i].col}"></i>${nm(i)}</span>`).join('')}</div><p class="note" id="rnote">Toca el gráfico para ver cada partida.</p>`}
function pairBlock(ms){const ps=pairs(ms).filter(p=>p.pj>=3);if(!ps.length)return `<p class="sub">Aún ninguna pareja llega a 3 partidas juntos.</p>`;
 const item=(p,low)=>`<div class="pair ${low?'low':''}"><div class="hs">${himg(p.p[0])}${himg(p.p[1])}</div><div class="nm">${pn(p.p)}</div><div class="sc">${p.v} de ${p.pj}</div></div>`;
 const top=ps.slice(0,3),bot=[...ps].reverse().filter(p=>p.r<.5&&!top.includes(p)).slice(0,3);
 return `<p class="sub">Mínimo 3 partidas juntos.</p><div class="plist">${top.map(p=>item(p)).join('')}${bot.map(p=>item(p,1)).join('')}</div>`}
function matrix(ms){const st=table(ms).filter(r=>r.pj>=2).sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id)),ids=st.map(r=>r.id).filter(i=>ORDER.includes(i)),t={};
 pairs(ms).forEach(p=>t[p.p.join('+')]=p);
 let h=`<div class="self"></div>`+ids.map(i=>`<div>${himg(i,'')}</div>`).join('');
 for(const a of ids){h+=`<div>${himg(a,'')}</div>`;for(const b of ids){if(a===b){h+=`<div class="self"></div>`;continue}const k=[a,b].sort().join('+'),p=t[k];
  if(!p){h+=`<div></div>`;continue}const al=(.12+p.r*.78).toFixed(2),ink=p.r>.55?'#0a1a35':'#eef4ff';h+=`<button type="button" data-pair="${k}" style="background:rgba(217,242,58,${al});color:${ink}" aria-label="${pn(p.p)}: ${p.v} de ${p.pj}">${pct(p.v,p.pj)}</button>`}}
 return `<div class="scroll"><div class="matrix" style="grid-template-columns:repeat(${ids.length+1},minmax(0,1fr))">${h}</div></div><p class="note" id="mnote">Porcentaje de victorias jugando juntos. Toca una casilla.</p>`}

 <h3>Pareja del Trimestre</h3>${pc(pod.pair)}${pod.tie.map(p=>pc(p)).join('')}${pod.tie.length?'<p class="demo">Empate. El desempate lo decide diciembre.</p>':''}

 <section class="sec"><h2>Logros</h2><p class="sub">Desde septiembre de 2025, que es cuando se sabe qué pareja ganó.</p>${logros(ms)}</section>
 <section class="sec"><h2>Palmarés</h2>${palmares(ms)}<h3>Trimestres cerrados</h3>${closed.map(k=>{const p=podium(inQ(ms,k)),[s,tt]=k.split('|');return `<div class="ach"><div class="hs" style="display:flex;gap:2px">${p.best?himg(p.best.id):''}${p.worst?himg(p.worst.id):''}</div><div><b>${tt} ${s}</b><span>Mejor: ${p.best?nm(p.best.id)+' '+pct(p.best.v,p.best.pj)+' %':'—'}. Paquete: ${p.worst?nm(p.worst.id)+' '+pct(p.worst.v,p.worst.pj)+' %':'—'}.${p.pair?' Pareja: '+pn(p.pair.p)+'.':''}</span></div></div>`}).join('')}</section>
 <section class="sec"><h2>Premios y castigos</h2><div class="scroll"><table class="catalog"><thead><tr><th>Cuándo</th><th>Gloria</th><th>Vergüenza</th></tr></thead><tbody>
 <tr><td>Semana</td><td>Héroes de la Semana</td><td>Paquetes de la Semana: 1 € cada uno al Bote desde diciembre</td></tr>
 <tr><td>Mes</td><td>MVP del Mes</td><td>Paquete del Mes</td></tr>
 <tr><td>Trimestre</td><td>No paga pista el siguiente miércoles</td><td>Patata en el avatar un trimestre y ronda de cervezas</td></tr>
 <tr><td>Temporada</td><td>La Pareja del Año cena con el Bote</td><td>Patata de Oro: organiza la cena y juega la última con camiseta de Paquete</td></tr></tbody></table></div></section>`}
function palmares(ms){const rows=[];const hs=(s,best,worst,nb,nw)=>rows.push(`<div class="ach"><div class="hs" style="display:flex;gap:2px">${himg(best)}${himg(worst)}</div><div><b>${s}</b><span>Campeón: ${nm(best)} ${nb} %. Patata de Oro: ${nm(worst)} ${nw} %.</span></div></div>`);
 hs('2025-26','xepa','victor','75','23');
 hs('2024-25','xepa','emilio','63','36');
 hs('2023-24','xepa','nacho','58','38');
 return rows.join('')+`<p class="demo">Campeones tal como los marca vuestro Excel, con los porcentajes recontados. En 2024-25 el Excel apuntó menos partidas de Xepa de las que jugó: bien contadas, Diego (68 %) le supera, pero el título se respeta.</p>`}
function logros(ms){const ids=[...new Set(ms.flatMap(m=>[...m.a,...m.b]))],S=ids.map(i=>({i,...streak(ms,i)})),by=(f)=>[...S].sort((a,b)=>f(b)-f(a))[0],T=table(ms),P=postTable(ms);
 const best=by(s=>s.mw),gafe=by(s=>s.ml),hierro=[...T].sort((a,b)=>b.pj-a.pj)[0],rey=P[0],fich=T.filter(r=>!FIJOS.includes(r.id)&&r.pj>=3).sort((a,b)=>b.p-a.p)[0];

 const line=(t,i,x)=>i?`<div class="pair"><div class="hs">${himg(i)}</div><div class="nm">${t}: ${nm(i)}</div><div class="sc">${x}</div></div>`:'';
 layer(`<div class="ov"><div class="inner"><div class="bar"><h2>${C.n}</h2><button class="close" type="button" data-close>CERRAR</button></div>
 <p><span class="tag">${C.m}</span></p><div class="big">${sp(id,pose)}</div>
 <div class="posebar" role="group" aria-label="Animación">${[['idle','Normal'],['win','Gana'],['lose','Pierde']].map(([k,l])=>`<button type="button" data-pose="${k}" data-pid="${id}" aria-pressed="${k===pose}">${l}</button>`).join('')}</div>
 <p>${C.q}</p>
 ${C.veh?`<div class="veh"><canvas class="px" id="vehc" width="36" height="18" role="img" aria-label="${C.vehn}"></canvas>${C.vehn}</div>`:''}
 <div class="stats"><div><b>${T.v}/${T.pj}</b><span>temporada</span></div><div><b>${pct(all.v,all.pj)}%</b><span>histórico</span></div><div><b>${P?String(P.v/2).replace('.',','):'0'}</b><span>puntos post</span></div><div><b>${s.mw}</b><span>mejor racha</span></div><div><b>${s.ml}</b><span>peor racha</span></div><div><b>${all.pj}</b><span>partidas</span></div></div>
 <div class="plist">${part[0]?line('Socio fetiche',part[0].id,part[0].v+' de '+part[0].pj):''}${part.length>1?line('Peor socio',part[part.length-1].id,part[part.length-1].v+' de '+part[part.length-1].pj):''}${nemesis&&nemesis.p>nemesis.g?line('Bestia negra',nemesis.id,nemesis.g+'-'+nemesis.p):''}${vict&&vict.g>vict.p?line('Víctima favorita',vict.id,vict.g+'-'+vict.p):''}</div>
 <p class="demo">Socios y rivales: datos desde septiembre de 2025.</p></div></div>`);
 const v=document.getElementById('vehc');if(v)drawVeh(v.getContext('2d'),C.veh)}
function layer(h){document.getElementById('layer').innerHTML=h;paint()}
function closeLayer(){stopFx();document.getElementById('layer').innerHTML=''}

/* resultado animado */
let fxT=null;function stopFx(){clearInterval(fxT);fxT=null}
const pick=(a,s)=>a[[...s].reduce((x,c)=>x+c.charCodeAt(0),0)%a.length];
function waText(m){const w=wn(m),l=ls(m);return `🎾 Paquetes Padel Tour · ${fd(m.d)}\n🏆 Héroes: ${pn(w)}${m.r?' ('+m.r+')':''}\n🥔 Paquetes: ${pn(l)}${m.d>=BOTE_DESDE?', 1 € cada uno al Bote':''}${m.p?`\n🌙 Post: ${pn(m[m.p])} (+0,5)`:''}`}
function cine(m){const all=[...m.a,...m.b];
 layer(`<div class="cine"><div class="stage"><p class="eyebrow">${fd(m.d).toUpperCase()} · 21:30</p><div class="row small">${sp(m.a[0],'idle')}${sp(m.a[1],'idle',2)}</div><p class="bigt">VS</p><div class="row small">${sp(m.b[0],'idle',1)}${sp(m.b[1],'idle',3)}</div><button class="btn" id="go" type="button">PULSA PARA VER EL RESULTADO</button><button class="close" type="button" data-close>CERRAR</button></div></div>`);
 document.getElementById('go').onclick=()=>{ctx();sfx.roll();const b=document.getElementById('go');b.textContent='¿QUIÉN PAGA?';b.classList.add('flash');b.disabled=true;setTimeout(()=>showRes(m),still?200:1300)}}
function showRes(m){const w=wn(m),l=ls(m);store.set('ppt_seen',m.id||m.d);
 layer(`<div class="cine"><canvas id="fx" width="130" height="240" aria-hidden="true"></canvas><div class="stage">
 <p class="eyebrow">HÉROES DE LA SEMANA</p><div class="row">${sp(w[0],'win')}${sp(w[1],'win',2)}</div><p class="bigt">${nm(w[0]).toUpperCase()} + ${nm(w[1]).toUpperCase()}</p><p class="quip">${pick(CAST[w[0]].win,m.d)}</p>
 ${m.p?`<p class="quip">Post: ${pn(m[m.p])}, +0,5.</p>`:''}
 <p class="eyebrow" style="color:var(--gold);margin-top:8px">PAQUETES DE LA SEMANA</p><div class="row small" style="padding-top:22px"><canvas class="px cloud" id="cloud" width="56" height="16" aria-hidden="true"></canvas>${sp(l[0],'lose')}${sp(l[1],'lose',2)}</div><p class="lost">${nm(l[0]).toUpperCase()} + ${nm(l[1]).toUpperCase()}</p><p class="quip">${pick(CAST[l[0]].lose,m.d)}</p>${m.d>=BOTE_DESDE?'<p class="quip" style="color:var(--gold)">1 € cada uno al Bote.</p>':''}
 <button class="btn" type="button" id="wa">COMPARTIR EN WHATSAPP</button><div class="acts"><button class="close" type="button" id="again">REPETIR</button><button class="close" type="button" data-close>CERRAR</button></div></div></div>`);
 const cl=document.getElementById('cloud').getContext('2d');blob(cl,6,5,44,10,'#5b6b86');blob(cl,14,1,18,8,'#6f7f9b');blob(cl,28,3,16,8,'#7b8ba8');
 document.getElementById('wa').onclick=()=>compartir(m);document.getElementById('again').onclick=()=>cine(m);
 sfx.fan();setTimeout(()=>{if(document.getElementById('fx'))sfx.sad()},3400);
 if(still)return;const c=document.getElementById('fx').getContext('2d'),cols=['#d9f23a','#f7bd2f','#ef4444','#46d68a','#6ad1ff','#fff'],P=[];for(let i=0;i<70;i++)P.push({x:Math.random()*130,y:-Math.random()*220,v:.7+Math.random()*1.2,c:cols[i%6],s:1+(i%2)});
 stopFx();fxT=setInterval(()=>{c.clearRect(0,0,130,240);for(const p of P){p.y+=p.v;p.x+=Math.sin((p.y+p.v*40)/9)*.5;if(p.y>120){p.y=-4;p.x=Math.random()*130}R(c,p.x,p.y,p.s,p.s+1,p.c)}
  const e=document.getElementById('cloud');if(e){const r=e.getBoundingClientRect(),k=240/innerHeight,x0=r.left*130/innerWidth,x1=r.right*130/innerWidth,y0=(r.bottom-4)*k;for(let i=0;i<22;i++){const t=(frame*3+i*17)%32;R(c,x0+((i*29)%100)/100*(x1-x0),y0+t,1,3,'#8fdcff')}}},60)}
function copy(t){const done=()=>toast('Copiado. Pégalo en el grupo.');try{navigator.clipboard.writeText(t).then(done,()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

/* apuntar partida */
const F={a:[],b:[],w:null,r:'2-0',p:'no',d:HOY};
function apuntar(){const tOfP=id=>F.a.includes(id)?'a':F.b.includes(id)?'b':'';const full=F.a.length===2&&F.b.length===2,can=full&&F.w;
 layer(`<div class="ov"><div class="inner"><div class="bar"><h2>Apuntar partida</h2><button class="close" type="button" data-close>CERRAR</button></div>
 <label class="sub" for="fd">Fecha</label><input id="fd" type="date" value="${F.d}" style="background:var(--panel2);color:var(--ink);border:0;padding:10px;font:inherit;width:100%">
 <p class="sub">Toca a los cuatro: los dos primeros forman la pareja 1.</p>
 <div class="pick">${[...ORDER,'dino',...guests()].map(id=>`<button type="button" data-f="${id}" data-t="${tOfP(id)}" aria-pressed="${!!tOfP(id)}">${himg(id,'')}${nm(id)}</button>`).join('')}</div>
 <div class="duo" style="grid-template-columns:1fr auto"><input class="fld" id="gname" type="text" maxlength="20" placeholder="Otro invitado" aria-label="Nombre del invitado"><button class="mini" type="button" id="gadd">Añadir</button></div>
 <div class="slots"><div><b>PAREJA 1</b>${F.a.map(nm).join(' + ')||'…'}</div><div><b>PAREJA 2</b>${F.b.map(nm).join(' + ')||'…'}</div></div>
 ${full?`<h3>¿Quién ganó?</h3><div class="choice"><button type="button" data-w="a" aria-pressed="${F.w==='a'}">${pn(F.a)}</button><button type="button" data-w="b" aria-pressed="${F.w==='b'}">${pn(F.b)}</button></div>
 <h3>Sets</h3><div class="choice"><button type="button" data-r="2-0" aria-pressed="${F.r==='2-0'}">2-0</button><button type="button" data-r="2-1" aria-pressed="${F.r==='2-1'}">2-1</button></div>
 ${F.r==='2-0'?`<h3>Postpartido</h3><div class="choice"><button type="button" data-post="no" aria-pressed="${F.p==='no'}">No hubo</button><button type="button" data-post="a" aria-pressed="${F.p==='a'}">${pn(F.a)}</button><button type="button" data-post="b" aria-pressed="${F.p==='b'}">${pn(F.b)}</button></div>`:'<p class="sub">Con 2-1 no suele haber post.</p>'}`:''}
 <button class="btn" type="button" id="save"${can?'':' disabled'}>GUARDAR Y VER RESULTADO</button>
 <p class="demo">La primera vez pide el PIN del grupo. Al guardar, lo ven todos.</p></div></div>`);
 document.getElementById('fd').onchange=e=>{F.d=e.target.value||HOY};
 document.getElementById('gadd').onclick=()=>{const v=document.getElementById('gname').value.trim();if(!v)return;const id=ensure(v);if(![...F.a,...F.b].includes(id)){if(F.a.length<2)F.a.push(id);else if(F.b.length<2)F.b.push(id)}apuntar()};
 const s=document.getElementById('save');s.onclick=()=>{if(!can)return;const dia=F.d,q=F.r==='2-0'&&F.p!=='no'?(F.p==='a'?1:2):'';
  op('partida',{d:dia,a1:CAST[F.a[0]].n,a2:CAST[F.a[1]].n,b1:CAST[F.b[0]].n,b2:CAST[F.b[1]].n,w:F.w==='a'?1:2,r:F.r,p:q},()=>{Object.assign(F,{a:[],b:[],w:null,r:'2-0',p:'no',d:HOY});closeLayer();render();const m=ALL().filter(x=>x.d===dia).pop();if(m)cine(m)})}}

/* ===== DATOS COMPARTIDOS ===== */
let lastJ='',SYNC=store.get('ppt_t',0),OFF=false;
const hora=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function statusTxt(){if(!LIVE)return'Copia de prueba: no guarda nada.';if(OFF)return SYNC?'Sin conexión. Datos de las '+hora(SYNC)+'.':'Sin conexión con el Google Sheet.';return SYNC?'Actualizado a las '+hora(SYNC)+'.':'Actualizando…'}
function setSt(){const e=document.getElementById('st');if(e)e.textContent=statusTxt()}
async function load(){if(!LIVE)return;try{const r=await fetch(API+(API.includes('?')?'&':'?')+'t='+Date.now()),s=await r.text(),j=JSON.parse(s);if(j.error)throw new Error(j.error);OFF=false;SYNC=Date.now();store.set('ppt_t',SYNC);if(s!==lastJ){lastJ=s;apply(j);store.set('ppt_cache',j);if(!document.getElementById('layer').innerHTML)render()}}catch(e){OFF=true}setSt()}
function busy(on){let e=document.getElementById('busy');if(on&&!e){e=document.createElement('div');e.id='busy';e.className='busy';e.textContent='Guardando…';document.body.appendChild(e)}if(!on&&e)e.remove()}
function askPin(fn,err){document.getElementById('layer2').innerHTML=`<div class="ov"><div class="inner"><div class="bar"><h2>PIN del grupo</h2><button class="close" type="button" id="pinx">CERRAR</button></div>${err?`<p style="color:var(--bad)">${err}</p>`:''}<p class="sub">Solo se pide la primera vez en este móvil.</p><input class="fld" id="pinI" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN"><button class="btn" type="button" id="pinOk">CONTINUAR</button></div></div>`;
 const close=()=>{document.getElementById('layer2').innerHTML=''};document.getElementById('pinx').onclick=close;document.getElementById('pinI').focus();
 document.getElementById('pinOk').onclick=()=>{const v=document.getElementById('pinI').value.trim();if(!v)return;store.set('ppt_pin',v);close();fn()}}
async function send(accion,data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion,pin:store.get('ppt_pin',''),...data})}),j=await r.json();if(j.error)throw new Error(j.error);await load();return j}
function op(accion,data,ok){if(!LIVE)return toast('Copia de prueba: no guarda nada.');if(!store.get('ppt_pin',''))return askPin(()=>op(accion,data,ok));
 busy(true);send(accion,data).then(()=>{busy(false);ok&&ok()},e=>{busy(false);if(e.message==='pin'){store.set('ppt_pin','');askPin(()=>op(accion,data,ok),'PIN incorrecto.')}else toast(e.message==='duplicada'?'Ese día ya tiene una partida apuntada.':e.message==='Failed to fetch'?'Sin conexión. Inténtalo de nuevo.':e.message)})}
function pedirAnular(hoja,id,tx){layer(`<div class="ov"><div class="inner"><div class="bar"><h2>Anular</h2><button class="close" type="button" data-close>CERRAR</button></div><p>${tx}</p><p class="sub">Desaparece de la app para todos. En el Google Sheet queda marcado como anulado.</p><button class="btn" type="button" id="anOk">ANULAR</button></div></div>`);
 document.getElementById('anOk').onclick=()=>op('anular',{hoja,id},()=>{closeLayer();render();toast('Anulado')})}
function formPista(t){const bz=t==='bizum',P=[...ORDER,...guests()],opt=P.map(id=>`<option value="${CAST[id].n}">${CAST[id].n}</option>`).join('');
 layer(`<div class="ov"><div class="inner"><div class="bar"><h2>${bz?'Apuntar Bizum':'Pago de pista'}</h2><button class="close" type="button" data-close>CERRAR</button></div>
 <div class="formg"><label class="sub" for="pfd">Fecha</label><input class="fld" id="pfd" type="date" value="${HOY}"></div>
 <div class="formg"><label class="sub" for="pde">${bz?'Quién envía':'Quién paga'}</label><select id="pde">${opt}</select></div>
 ${bz?`<div class="formg"><label class="sub" for="pa">Quién recibe</label><select id="pa">${opt}</select></div>`:''}
 <div class="formg"><label class="sub" for="pe">Importe en euros</label><input class="fld" id="pe" type="text" inputmode="decimal" value="${bz?PISTA_PRECIO:PISTA_PRECIO*4}"></div>
 <div class="formg"><label class="sub" for="pn">Nota, si quieres</label><input class="fld" id="pn" type="text" maxlength="80"></div>
 <button class="btn" type="button" id="pOk">GUARDAR</button></div></div>`);
 document.getElementById('pOk').onclick=()=>{const v=id=>document.getElementById(id).value,e=parseFloat(v('pe').replace(',','.'));if(!(e>0))return toast('Revisa el importe');if(bz&&v('pde')===v('pa'))return toast('Elige dos personas distintas');
  op('pista',{t,d:v('pfd')||HOY,de:v('pde'),a:bz?v('pa'):'',e,n:v('pn')},()=>{closeLayer();render();toast('Apuntado')})}}
function reclamo(){const d=saldoPista().filter(r=>r.s<0);return `🎾 La Caja del Paquetes Padel Tour informa:\n${d.map(r=>`💸 ${CAST[r.id].n} debe ${eu(-r.s)} de pista`).join('\n')}\nBizum y aquí paz.`}
async function enviar(text,file){const url=location.href.split('#')[0],t=url.startsWith('http')?text+'\n'+url:text;
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:t})}catch(e){}return}
 if(!file&&navigator.share){try{await navigator.share({text:t})}catch(e){}return}
 copy(t);window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
async function tarjeta(m){await Promise.all(['40px "Press Start 2P"','700 40px "Pixelify Sans"'].map(f=>document.fonts.load(f))).catch(()=>{});
 const S=1080,cv=document.createElement('canvas');cv.width=S;cv.height=S;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
 for(let i=0;i<14;i++){c.fillStyle=i%2?'#1b6cc4':'#1659a8';c.fillRect(i*S/14,0,S/14+1,S)}
 c.strokeStyle='#eaf2ff';c.lineWidth=16;c.strokeRect(30,30,S-60,S-60);
 const t=document.createElement('canvas');t.width=W;t.height=H;const k=t.getContext('2d'),spr=(id,pose,x,y,e)=>{draw(k,id,pose,1);c.drawImage(t,x,y,W*e,H*e)};
 const txt=(s,y,f,col)=>{c.font=f;c.fillStyle=col;c.textAlign='center';c.fillText(s,S/2,y)};
 const w=wn(m),l=ls(m);
 txt('PAQUETES PADEL TOUR',112,'38px "Press Start 2P",monospace','#d9f23a');txt(fd(m.d).toUpperCase()+' · 21:30',166,'700 38px "Pixelify Sans",sans-serif','#eaf2ff');
 spr(w[0],'win',230,180,6);spr(w[1],'win',562,180,6);
 txt(`${CAST[w[0]].n} + ${CAST[w[1]].n}`.toUpperCase(),600,'700 60px "Pixelify Sans",sans-serif','#d9f23a');txt('HÉROES DE LA SEMANA'+(m.r?' · '+m.r:''),650,'700 34px "Pixelify Sans",sans-serif','#eaf2ff');
 spr(l[0],'lose',316,660,4);spr(l[1],'lose',572,660,4);
 txt(`${CAST[l[0]].n} + ${CAST[l[1]].n}`.toUpperCase(),950,'700 46px "Pixelify Sans",sans-serif','#eaf2ff');txt(m.p?`PAQUETES DE LA SEMANA · Post: ${CAST[m[m.p][0]].n} + ${CAST[m[m.p][1]].n}`:'PAQUETES DE LA SEMANA',1000,'700 32px "Pixelify Sans",sans-serif','#f7bd2f');
 return new Promise(r=>cv.toBlob(r,'image/png'))}
async function compartir(m){try{const b=await tarjeta(m);window._card=b;await enviar(waText(m),new File([b],'resultado-paquetes.png',{type:'image/png'}))}catch(e){await enviar(waText(m))}}

/* eventos */
document.addEventListener('click',e=>{const t=e.target.closest('button,rect');if(!t)return;const d=t.dataset;
 if(d.v)return go(d.v);
 if('close'in d)return closeLayer();
 if(d.pose&&d.pid)return ficha(d.pid,d.pose);
 if(d.p)return ficha(d.p);
 if(d.cine)return cine(ALL()[+d.cine]);
 if(t.id==='snd')return toggleTheme();
 if(t.id==='fab')return apuntar();
 if(t.id==='noinst'){store.set('ppt_noinst',true);return render()}
 if(t.id==='recl')return enviar(reclamo());
 if(d.fp)return formPista(d.fp);
 if(d.an)return pedirAnular(d.an,d.id,d.tx||'');
 if(d.tab){state.tab=d.tab;return render()}
 if(d.pay)return op('pago',{j:CAST[d.pay].n,e:+d.e,d:HOY},()=>{sfx.coin();render();toast('Pago apuntado')});
 if(d.m){const m=ALL()[+d.m],n=document.getElementById('rnote');if(n)n.textContent=`${fd(m.d)}: ${pn(wn(m))} ganan a ${pn(ls(m))}.${m.p?' Post: '+pn(m[m.p])+'.':''}`;return}
 if(d.pair){const p=pairs(periodMs()).find(x=>x.p.join('+')===d.pair),n=document.getElementById('mnote');if(n&&p)n.textContent=`${pn(p.p)}: ${p.v} de ${p.pj} juntos.`;return}
 if(d.f){const id=d.f;if(F.a.includes(id))F.a=F.a.filter(x=>x!==id);else if(F.b.includes(id))F.b=F.b.filter(x=>x!==id);else if(F.a.length<2)F.a.push(id);else if(F.b.length<2)F.b.push(id);if(F.a.length<2||F.b.length<2)F.w=null;return apuntar()}
 if(d.w){F.w=d.w;return apuntar()}
 if(d.r){F.r=d.r;if(d.r==='2-1')F.p='no';return apuntar()}
 if(d.post){F.p=d.post;return apuntar()}
});
document.addEventListener('change',e=>{if(e.target.id==='per'){state.per=e.target.value;render()}});
document.getElementById('fab').addEventListener('click',()=>{});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(RENDER[v]&&v!==state.v)go(v)});
const hv=location.hash.slice(1);if(RENDER[hv])state.v=hv;
window.PPT={table,postTable,pairs,podium,streak,ALL,charges,seasonOf,saldoPista,test(u){API=u;LIVE=true;return load()},tarjeta};
const cc=store.get('ppt_cache',null);if(cc)try{apply(cc);lastJ=JSON.stringify(cc)}catch(e){}
render();load();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
